<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cindy's Bakeshop Admin - Settings</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  :root {
    --primary: #e74c3c;
    --secondary: #f1c40f;
    --dark: #2c3e50;
    --light: #fdfdfd;
    --card-bg: #fff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
  body { display: flex; background: var(--light); color: #333; }

  /* Sidebar */
  .sidebar {
    width: 240px; height: 100vh;
    background: linear-gradient(180deg, #2c3e50, #34495e, #2c3e50);
    color: #fff; position: fixed; top: 0; left: 0;
    display: flex; flex-direction: column; padding: 20px 0;
  }
  .sidebar h2 {
    text-align: center; margin-bottom: 40px; font-size: 22px;
    font-weight: bold; color: var(--secondary);
  }
  .sidebar ul { list-style: none; flex-grow: 1; }
  .sidebar ul li { margin: 10px 0; }
  .sidebar ul li a {
    color: #ddd; text-decoration: none; display: flex; align-items: center;
    padding: 12px 20px; border-left: 4px solid transparent; font-size: 15px;
    transition: color 0.3s, background 0.3s;
  }
  .sidebar ul li a span { margin-right: 10px; font-size: 18px; }
  .sidebar ul li a.active { color: #fff; background: rgba(231,76,60,0.25); border-left: 4px solid var(--primary); }
  .sidebar ul li a:hover { color: #fff; background: rgba(255,255,255,0.05); border-left: 4px solid var(--primary); }

  /* Dropdown */
  .sidebar .dropdown > a { cursor: pointer; }
  .sidebar .submenu { display: none; list-style: none; padding-left: 30px; }
  .sidebar .submenu li a { font-size: 14px; padding: 8px 20px; color: #ccc; }
  .sidebar .submenu li a:hover { color: #fff; }
  .sidebar .dropdown.active .submenu { display: block; }

  /* Main */
  .main { margin-left: 240px; flex: 1; padding: 20px 30px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  .header h1 {
        font-size: 24px;
        color: black;
      }
  .header .user-info {
    display: flex; align-items: center; gap: 10px; text-decoration: none; color: #333; font-weight: 500;
  }
  .header .user-info:hover { opacity: 0.8; }
  .header .user-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }

  /* Settings Cards */
  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .settings-card {
    background: var(--card-bg); padding: 20px 25px; border-radius: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }
  .settings-card h2 { font-size: 18px; margin-bottom: 15px; color: var(--dark); border-bottom: 2px solid #eee; padding-bottom: 8px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-weight: 600; margin-bottom: 6px; }
  .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
  .btn-save {
    margin-top: 10px; display: inline-block; padding: 10px 18px;
    background: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: 0.3s;
  }
  .btn-save:hover { background: #c0392b; }
  .sidebar-logo {
  width: 120px;
  height: 60px;
  margin: 0 auto 20px auto;
  overflow: hidden;
}

.sidebar-logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-logo">
        <img src="Cindys.png" alt="Cindy's Bakeshop Logo" />
      </div>
  <ul>
    <li><a href="dashboard.html"><span><i class="fa-solid fa-chart-pie"></i></span> Dashboard</a></li>
    <li><a href="users.html"><span><i class="fa-solid fa-users"></i></span> Users</a></li>
    <li><a href="products.html"><span><i class="fa-solid fa-box-open"></i></span> Products</a></li>
    <li class="dropdown">
  <a href="#"><span><i class="fa-solid fa-cart-shopping"></i></span> Orders
    <i class="fa-solid fa-caret-down" style="margin-left:auto;"></i>
  </a>
  <ul class="submenu">
    <li><a href="orders.html"><i class="fa-solid fa-list-check"></i> Manage Orders</a></li>
    <li><a href="delivery.html"><i class="fa-solid fa-truck"></i> Delivery</a></li>
  </ul>
</li>

    <li><a href="report.html"><span><i class="fa-solid fa-chart-line"></i></span> Reports</a></li>
    <li><a href="notifications.html"><span><i class="fa-solid fa-bell"></i></span> Notifications</a></li>
    <li><a href="settings.html" class="active"><span><i class="fa-solid fa-gear"></i></span> Settings</a></li>
  </ul>
</div>

<!-- Main -->
<div class="main">
  <div class="header">
    <h1>Settings</h1>
    <a href="edit-profile.html" class="user-info">
      <span>Admin</span>
      <img src="https://via.placeholder.com/40" alt="User" />
    </a>
  </div>

  <div class="settings-grid">
    <!-- Account -->
    <div class="settings-card">
      <h2><i class="fa fa-user"></i> Account Settings</h2>
      <div class="form-group">
        <label>Username</label>
        <input type="text" placeholder="Enter username" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter email" />
      </div>
      <button class="btn-save">Save Changes</button>
    </div>

    <!-- Preferences -->
    <div class="settings-card">
      <h2><i class="fa fa-sliders-h"></i> Preferences</h2>
     <div class="form-group">
  <label>Theme</label>
  <select id="theme-select">
    <option value="light">Light</option>
    <option value="dark">Dark</option>
    <option value="red">Red</option>
    <option value="green">Green</option>
    <option value="blue">Blue</option>
    <option value="purple">Purple</option>
    <option value="orange">Orange</option>
  </select>
</div>




      <div class="form-group">
        <label>Language</label>
        <select>
          <option>English</option>
          <option>Filipino</option>
        </select>
      </div>
      <button id="btn-update-theme" class="btn-save">Update Preferences</button>
    </div>

    <!-- Security -->
    <div class="settings-card">
      <h2><i class="fa fa-lock"></i> Security</h2>
      <div class="form-group">
        <label>Change Password</label>
        <input type="password" placeholder="Enter new password" />
      </div>
      <div class="form-group">
        <label>Two-Factor Authentication</label>
        <select>
          <option>Disabled</option>
          <option>Enabled</option>
        </select>
      </div>
      <button class="btn-save">Update Security</button>


      <div id="theme-popup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
    background: rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000;">
  <div style="background:#fff; padding:20px 30px; border-radius:10px; text-align:center; min-width:250px;">
    <p style="margin-bottom:20px; font-weight:500;">Theme updated successfully!</p>
    <button id="popup-ok" style="padding:8px 18px; background:#e74c3c; color:#fff; border:none; border-radius:6px; cursor:pointer;">OK</button>
  </div>
</div>

    </div>
  </div>
</div>

<script>
  // Sidebar dropdown toggle
  document.querySelectorAll(".sidebar .dropdown > a").forEach((menu) => {
    menu.addEventListener("click", (e) => {
      e.preventDefault();
      menu.parentElement.classList.toggle("active");
    });
  });
  const themeSelect = document.getElementById('theme-select');
const btnUpdate = document.getElementById('btn-update-theme');
const popup = document.getElementById('theme-popup');
const popupOk = document.getElementById('popup-ok');

const themes = {
  light: {
    '--light': '#fdfdfd',
    '--dark': '#2c3e50',
    '--card-bg': '#fff',
    '--primary': '#e74c3c',
    '--secondary': '#f1c40f',
    'bodyColor': '#333'
  },
  dark: {
    '--light': '#2c3e50',
    '--dark': '#ecf0f1',
    '--card-bg': '#34495e',
    '--primary': '#e67e22',
    '--secondary': '#f39c12',
    'bodyColor': '#ecf0f1'
  },
  red: {
    '--light': '#fff0f0',
    '--dark': '#8b0000',
    '--card-bg': '#ffd6d6',
    '--primary': '#e74c3c',
    '--secondary': '#c0392b',
    'bodyColor': '#4b0000'
  },
  green: {
    '--light': '#f0fff0',
    '--dark': '#006400',
    '--card-bg': '#d6ffd6',
    '--primary': '#27ae60',
    '--secondary': '#2ecc71',
    'bodyColor': '#004d00'
  },
  blue: {
    '--light': '#f0f8ff',
    '--dark': '#003366',
    '--card-bg': '#d6e6ff',
    '--primary': '#3498db',
    '--secondary': '#2980b9',
    'bodyColor': '#001f3f'
  },
  purple: {
    '--light': '#f5f0ff',
    '--dark': '#4b0082',
    '--card-bg': '#e6d6ff',
    '--primary': '#8e44ad',
    '--secondary': '#9b59b6',
    'bodyColor': '#2c003e'
  },
  orange: {
    '--light': '#fffaf0',
    '--dark': '#8b4500',
    '--card-bg': '#ffe6d6',
    '--primary': '#e67e22',
    '--secondary': '#d35400',
    'bodyColor': '#4b2200'
  }
};

// Apply theme
function applyTheme(themeName){
  const theme = themes[themeName];
  for(let key in theme){
    if(key==='bodyColor'){
      document.body.style.color = theme[key];
      document.body.style.background = theme['--light'];
    } else {
      document.documentElement.style.setProperty(key, theme[key]);
    }
  }
  localStorage.setItem('selectedTheme', themeName);
}

// Apply saved theme on load
const savedTheme = localStorage.getItem('selectedTheme') || 'light';
applyTheme(savedTheme); // just apply, don't show popup
themeSelect.value = savedTheme;


// On Update button click
btnUpdate.addEventListener('click', ()=>{
  const selectedTheme = themeSelect.value;
  applyTheme(selectedTheme);
  popup.style.display = 'flex'; // only show popup here
});

// Close popup on OK
popupOk.addEventListener('click', ()=>{
  popup.style.display = 'none';
});
</script>
</body>
</html>
