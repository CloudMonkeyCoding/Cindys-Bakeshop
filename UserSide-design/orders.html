<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cindy's Bakery — Order History</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      align-items: center;
      background: #ff6a00;
      color: white;
      padding: 12px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    header button {
      background: white;
      color: #ff6a00;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
    }
    header h1 {
      font-size: 18px;
      margin: 0;
      flex: 1;
      text-align: center;
    }
    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .tab {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      color: #555;
      transition: all 0.2s ease;
    }
    .tab.active {
      background: #ff6a00;
      color: white;
      border-color: #ff6a00;
    }
    .orders {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 0 15px 20px;
    }
    .order-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 15px;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      color: #666;
    }
    .order-items {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .order-items img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
    }
    .item-info {
      flex: 1;
    }
    .item-info h3 {
      margin: 0;
      font-size: 15px;
      color: #333;
    }
    .item-info p {
      margin: 4px 0;
      font-size: 13px;
      color: #777;
    }
    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status {
      font-size: 13px;
      font-weight: bold;
    }
    .status.completed { color: green; }
    .status.cancelled { color: red; }
    .status.pending { color: #ff6a00; }
    .total {
      font-weight: bold;
      font-size: 15px;
      color: #111;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <button onclick="history.back()">← Back</button>
    <h1>Order History</h1>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-filter="all">All</div>
    <div class="tab" data-filter="topay">To Pay</div>
    <div class="tab" data-filter="toprepare">To Prepare</div>
    <div class="tab" data-filter="toreceive">To Receive</div>
    <div class="tab" data-filter="completed">Completed</div>
  </div>

  <!-- Orders -->
  <div class="orders">
    <!-- Order 1 -->
    <div class="order-card" data-status="completed">
      <div class="order-header">
        <span>Order #1025</span>
        <span>Sept 11, 2025</span>
      </div>
      <div class="order-items">
        <img src="https://via.placeholder.com/70x70.png?text=Cake" alt="Chocolate Cake">
        <div class="item-info">
          <h3>Chocolate Cake</h3>
          <p>1x, Paid with GCash</p>
        </div>
      </div>
      <div class="order-footer">
        <span class="status completed">✔ Completed</span>
        <span class="total">₱820.00</span>
      </div>
    </div>

    <!-- Order 2 -->
    <div class="order-card" data-status="toreceive">
      <div class="order-header">
        <span>Order #1024</span>
        <span>Sept 09, 2025</span>
      </div>
      <div class="order-items">
        <img src="https://via.placeholder.com/70x70.png?text=Pandesal" alt="Pandesal Pack">
        <div class="item-info">
          <h3>Pandesal Pack (5x)</h3>
          <p>Cash on Pickup</p>
        </div>
      </div>
      <div class="order-footer">
        <span class="status pending">To Receive</span>
        <span class="total">₱250.00</span>
      </div>
    </div>

    <!-- Order 3 -->
    <div class="order-card" data-status="toprepare">
      <div class="order-header">
        <span>Order #1023</span>
        <span>Sept 08, 2025</span>
      </div>
      <div class="order-items">
        <img src="https://via.placeholder.com/70x70.png?text=Tapsilog" alt="Tapsilog Meal">
        <div class="item-info">
          <h3>Tapsilog Meal</h3>
          <p>2x, Cash</p>
        </div>
      </div>
      <div class="order-footer">
        <span class="status pending">To Prepare</span>
        <span class="total">₱450.00</span>
      </div>
    </div>
  </div>

  <script>
    const tabs = document.querySelectorAll(".tab");
    const orders = document.querySelectorAll(".order-card");

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        // Reset active tab
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        const filter = tab.dataset.filter;

        orders.forEach(order => {
          if (filter === "all" || order.dataset.status === filter) {
            order.style.display = "block";
          } else {
            order.style.display = "none";
          }
        });
      });
    });
  </script>
</body>
</html>
